name: Build Android all sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-all-sources.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.4'
  NDK_VERSION: '28.2.13676358'

concurrency:
  group: android-all-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: 真果鉴全站源 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true

      - name: 安装 Android NDK
        run: |
          set -euo pipefail
          installed=""
          candidates="$NDK_VERSION $(sdkmanager --list 2>/dev/null | sed -n 's/^ *ndk;\([0-9.]*\).*/\1/p' | sort -Vr | head -5)"
          for candidate in $candidates; do
            if sdkmanager "ndk;$candidate" > /dev/null 2>&1; then
              installed="$candidate"
              break
            fi
          done
          if [ -z "$installed" ]; then
            echo "无法安装 Android NDK" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$installed" >> "$GITHUB_ENV"
          echo "已安装 NDK $installed"

      - name: 配置发布签名
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/configure_signing.py
          if [ -f android/key.properties ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置发布签名 Secrets，本次 APK 使用 debug 签名，仅供测试，不可用于正式分发。"
          fi

      - name: 构建真果鉴 APK
        run: python scripts/build_android.py --all-sources

      - name: 清理签名文件
        if: always()
        run: python scripts/configure_signing.py --clean

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

      - name: 发布 Release
        if: always() && hashFiles('dist/android/*.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="zhenguojian-v${version//+/-}"
          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            note="已使用固定发布证书签名，可覆盖升级。"
          else
            note="未配置发布签名 Secrets，当前为 debug 签名，仅供测试，不能覆盖正式版安装。"
          fi
          {
            printf '%s\n\n' "真果鉴（全部站源）Android 安装包，源码版本 ${version}。"
            printf '%s\n' "$note"
            printf '\n%s\n' "- *-arm64-v8a.apk：绝大多数手机选这个"
            printf '%s\n' "- *-armeabi-v7a.apk：较老的 32 位手机"
            printf '%s\n' "- *-x86_64.apk：模拟器"
            printf '\n%s\n' "校验：SHA256SUMS.txt"
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/android/*.apk dist/android/SHA256SUMS.txt --clobber
            gh release edit "$tag" --title "真果鉴（全站源）${version}" --notes-file notes.md
          else
            gh release create "$tag" dist/android/*.apk dist/android/SHA256SUMS.txt \
              --title "真果鉴（全站源）${version}" --notes-file notes.md
          fi
